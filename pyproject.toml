[project]
name = "jobfinder"
version = "1.2.0"
description = "Local-first Windows desktop job research application"
requires-python = ">=3.13"
dependencies = [
  "PySide6>=6.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.8",
  "httpx>=0.28",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
  "ddgs>=9.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-qt>=4.4", "pyinstaller>=6.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
